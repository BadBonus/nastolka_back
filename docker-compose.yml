version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nuxt_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-my_db}
      IMGPROXY_BASE_URL: 'http://host.docker.internal:4000'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - '8080:8080'

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:latest
    ports:
      - '8079:8080'
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_INSECURE: 'false'
      IMGPROXY_ALLOW_LOCALHOST_SOURCES: 'true'
      IMGPROXY_ALLOW_LOCAL_NETWORKS: 'true'
      IMGPROXY_PRESETS: ${IMGPROXY_PRESETS}
      IMGPROXY_ONLY_PRESETS: 'true'
      # IMGPROXY_DEVELOPMENT_ERRORS_MODE: 'true'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: always

volumes:
  postgres_data:
